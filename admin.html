<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://zblqmohpsqtydqowmlqh.supabase.co wss://zblqmohpsqtydqowmlqh.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Admin | Ashwani Kumar, IAS</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="images/favicon.png"><link rel="stylesheet" href="css/output.css"><link rel="stylesheet" href="css/typography.css"><script src="js/theme-init.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-ivory dark:bg-slate-950">

<div id="login-view" class="flex min-h-screen items-center justify-center px-5">
  <form id="login-form" class="card w-full max-w-sm">
    <p class="eyebrow">Admin</p>
    <h1 class="text-2xl font-semibold text-navy-900 dark:text-white">Sign in</h1>
    <label class="mt-6 block text-sm font-semibold">Email<input required type="email" id="login-email" autocomplete="username" class="mt-2 w-full rounded-xl border border-slate-200 bg-transparent px-4 py-3 dark:border-slate-700" placeholder="you@example.com"></label>
    <label class="mt-4 block text-sm font-semibold">Password<input required type="password" id="login-password" autocomplete="current-password" class="mt-2 w-full rounded-xl border border-slate-200 bg-transparent px-4 py-3 dark:border-slate-700" placeholder="••••••••"></label>
    <button class="button-primary mt-6 w-full" type="submit">Sign in</button>
    <p id="login-error" class="mt-3 text-sm text-red-600" role="alert"></p>
  </form>
</div>

<div id="dashboard-view" class="hidden min-h-screen">
  <header class="border-b border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-900">
    <div class="shell flex h-20 items-center justify-between">
      <div><p class="font-display text-xl text-navy-900 dark:text-white">Admin dashboard</p><p class="text-xs text-slate-500" id="whoami"></p></div>
      <button id="logout-btn" class="button-ghost">Sign out</button>
    </div>
  </header>

  <div class="shell py-10">
    <div class="flex gap-3 border-b border-slate-200 dark:border-slate-700">
      <button data-tab="messages" class="admin-tab active-tab">Messages <span id="unread-badge" class="ml-1 hidden rounded-full bg-gold-400 px-2 py-0.5 text-xs font-bold text-navy-950"></span></button>
      <button data-tab="publications" class="admin-tab">Publications</button>
    </div>

    <!-- MESSAGES TAB -->
    <section id="tab-messages" class="mt-8">
      <p class="mb-4 text-sm text-slate-500">Contact form submissions, newest first.</p>
      <div id="messages-list" class="space-y-4"></div>
    </section>

    <!-- PUBLICATIONS TAB -->
    <section id="tab-publications" class="mt-8 hidden">
      <div class="mb-6 flex items-center justify-between">
        <p class="text-sm text-slate-500">Manage the articles shown on your Publications page.</p>
        <button id="add-pub-btn" class="button-primary">+ Add publication</button>
      </div>
      <div id="pub-form-wrap" class="card mb-6 hidden">
        <h3 class="text-lg font-semibold" id="pub-form-title">Add publication</h3>
        <input type="hidden" id="pub-id">
        <div class="mt-4 grid gap-4 sm:grid-cols-2">
          <label class="text-sm font-semibold">Date<input id="pub-date" class="mt-2 w-full rounded-xl border border-slate-200 bg-transparent px-4 py-3 dark:border-slate-700" placeholder="5 May 2025"></label>
          <label class="text-sm font-semibold">Publication name<input id="pub-publication" class="mt-2 w-full rounded-xl border border-slate-200 bg-transparent px-4 py-3 dark:border-slate-700" placeholder="Economic Times Government"></label>
        </div>
        <label class="mt-4 block text-sm font-semibold">Title<input id="pub-title" class="mt-2 w-full rounded-xl border border-slate-200 bg-transparent px-4 py-3 dark:border-slate-700" placeholder="Article headline"></label>
        <label class="mt-4 block text-sm font-semibold">Article URL<input id="pub-url" class="mt-2 w-full rounded-xl border border-slate-200 bg-transparent px-4 py-3 dark:border-slate-700" placeholder="https://..."></label>
        <label class="mt-4 block text-sm font-semibold">Image path<input id="pub-image" class="mt-2 w-full rounded-xl border border-slate-200 bg-transparent px-4 py-3 dark:border-slate-700" placeholder="images/publications/example.png"></label>
        <div class="mt-6 flex gap-3">
          <button id="pub-save-btn" class="button-primary">Save</button>
          <button id="pub-cancel-btn" class="button-ghost" type="button">Cancel</button>
        </div>
        <p id="pub-form-error" class="mt-3 text-sm text-red-600" role="alert"></p>
      </div>
      <div id="pub-list" class="space-y-4"></div>
    </section>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/admin.js"></script>
</body></html>
